<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marca do eco-system: monograma GC em Marcellus sobre cartolina,
       filete cobre — a versão mínima do "card on the desk". -->
  <rect width="64" height="64" rx="10" fill="#0E0E10"/>
  <rect x="5" y="5" width="54" height="54" rx="7" fill="#17181B"
        stroke="#8C9FC7" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="32" y="41.5" text-anchor="middle"
        font-family="Marcellus, 'Times New Roman', serif" font-size="27"
        fill="#8C9FC7" letter-spacing="1">GC</text>
  <line x1="14" y1="49" x2="50" y2="49" stroke="#8C9FC7"
        stroke-opacity="0.7" stroke-width="0.9"/>
</svg>
